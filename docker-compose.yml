services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: helm13f
      POSTGRES_PASSWORD: helm13f
      POSTGRES_DB: helm13f
    ports:
      - '5432:5432'
    volumes:
      - helm13f-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helm13f -d helm13f']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - helm13f-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  helm13f-pg-data:
  helm13f-redis-data:
